<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Papers</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup" id="app">
  <header class="pp-head">
    <div class="logo" id="logo"></div>
    <div class="pp-title"><h1>New Papers</h1><span id="checked" aria-live="polite">Loading…</span></div>
    <button class="btn btn-sm" id="refresh" type="button"></button>
    <button class="btn btn-sm btn-ghost" id="history-btn" type="button" aria-expanded="false" aria-controls="history" title="What was checked, when, and what worked"></button>
    <button class="btn btn-ghost btn-icon" id="settings" type="button" aria-label="Settings" title="Settings"></button>
  </header>
  <div id="banner-slot"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Topics"></div>
  <div class="topic-bar" id="topic-bar"></div>
  <div class="list" id="list" role="tabpanel" tabindex="-1"></div>
  <section class="history" id="history" aria-labelledby="h-history" hidden>
    <div class="hi-head"><h2 id="h-history">Check history</h2><button class="btn btn-ghost btn-icon" id="history-close" type="button" aria-label="Close history" title="Close"></button></div>
    <div class="hi-body" id="history-body"></div>
  </section>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <footer class="pp-foot"><span id="foot-count"></span><span id="foot-sources"></span></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
